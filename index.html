<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sideral Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ══════════════════════════════
         SCREEN 1 — COUNTDOWN
    ══════════════════════════════ -->
    <div id="countdownScreen" class="screen">
        <p class="next-label">PRÓXIMA TRASMISIÓN</p>
        <div class="flip-clock">
            <div class="flip-unit">
                <div class="flip-pair" id="fp-days"></div>
                <span class="unit-lbl">DIAS</span>
            </div>
            <span class="fc-colon">:</span>
            <div class="flip-unit">
                <div class="flip-pair" id="fp-hours"></div>
                <span class="unit-lbl">HORAS</span>
            </div>
            <span class="fc-colon">:</span>
            <div class="flip-unit">
                <div class="flip-pair" id="fp-mins"></div>
                <span class="unit-lbl">MINUTOS</span>
            </div>
        </div>
        <button class="enter-btn" id="enterBtn">ENTRAR A RADIO EN VIVO ↗</button>
    </div>

    <!-- ══════════════════════════════
         SCREEN 2 — LIVE PLAYER
    ══════════════════════════════ -->
    <div id="liveScreen" class="screen hidden">

        <!-- Radio Section -->
        <div class="radio-section">
            <div class="header-wrapper">
                <div id="vivo-status">
                    <div class="led-vivo-rojo" id="vivoLed"></div>
                    <span class="vivo-font">VIVO</span>
                </div>
            </div>

            <div class="fader-area">
                <div class="surco"></div>
                <div id="vu-left" class="vu-col"></div>
                <input type="range" id="volume-fader" min="0" max="1" step="0.01" value="0.2" class="technics-fader" aria-label="Volume">
                <div id="vu-right" class="vu-col"></div>
            </div>

            <button id="play-btn" class="technics-button" aria-label="Play / Stop">
                <div id="status-led" class="led-luz-off"></div>
            </button>
        </div>

        <!-- Chat Section -->
        <div class="chat-container">

            <div class="nick-row">
                <input type="text" id="nickInput" placeholder="¿Quién habla?" maxlength="24" autocomplete="off" spellcheck="false">
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="msg system">Conectando al chat…</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="..." maxlength="200" autocomplete="off">
                <button class="send-btn" id="sendBtn">↗</button>
            </div>

        </div>

    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-overlay hidden">
        <div class="admin-box">
            <div class="led-font admin-title">// ADMIN //</div>
            <label class="admin-label">PRÓXIMO SHOW</label>
            <input type="datetime-local" id="adminDateInput" class="admin-input">
            <div class="admin-current" id="adminCurrent"></div>
            <div class="admin-buttons">
                <button id="adminSave" class="admin-btn save">GUARDAR</button>
                <button id="adminCancel" class="admin-btn cancel">CANCELAR</button>
            </div>
        </div>
    </div>

    <audio id="radio-player" crossorigin="anonymous"></audio>
    <script src="script.js"></script>
</body>
</html>
