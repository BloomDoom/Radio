<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Secreta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Portrait-mode block -->
    <div id="portrait-block">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/>
        </svg>
        <p>Girá el dispositivo<br>a modo horizontal</p>
    </div>

    <!-- ══════════════════════════════
         SCREEN 1 — COUNTDOWN
    ══════════════════════════════ -->
    <div id="countdownScreen" class="screen">
        <p class="next-label">PRÓXIMA TRANSMISIÓN</p>
        <div class="flip-clock">
            <div class="flip-unit">
                <div class="flip-pair" id="fp-days"></div>
                <span class="unit-lbl">DIAS</span>
            </div>
            <span class="fc-colon">:</span>
            <div class="flip-unit">
                <div class="flip-pair" id="fp-hours"></div>
                <span class="unit-lbl">HORAS</span>
            </div>
            <span class="fc-colon">:</span>
            <div class="flip-unit">
                <div class="flip-pair" id="fp-mins"></div>
                <span class="unit-lbl">MINUTOS</span>
            </div>
        </div>
        <button class="enter-btn" id="enterBtn">ENTRAR</button>
    </div>

    <!-- ══════════════════════════════
         SCREEN 2 — LIVE PLAYER
    ══════════════════════════════ -->
    <div id="liveScreen" class="screen hidden">

        <!-- Radio Section -->
        <div class="radio-section">
            <div class="header-wrapper">
                <div id="vivo-status">
                    <div class="led-vivo-rojo" id="vivoLed"></div>
                    <span class="vivo-font">VIVO</span>
                </div>
            </div>

            <div class="fader-area">
                <div class="surco"></div>
                <div id="vu-left" class="vu-col"></div>
                <input type="range" id="volume-fader" min="0" max="1" step="0.01" value="0.2" class="technics-fader" aria-label="Volume">
                <div id="vu-right" class="vu-col"></div>
            </div>

            <button id="play-btn" class="technics-button" aria-label="Play / Stop">
                <div id="status-led" class="led-luz-off"></div>
            </button>
        </div>

        <!-- Chat Section -->
        <div class="chat-container">

            <div class="nick-row">
                <input type="text" id="nickInput" placeholder="¿Quién habla?" maxlength="24" autocomplete="off" spellcheck="false">
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="msg system">> conectando...</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="Mensaje..." maxlength="200" autocomplete="off">
                <button class="send-btn" id="sendBtn">ENVIAR</button>
            </div>

        </div>

    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-overlay hidden">
        <div class="admin-box">
            <div class="led-font admin-title">// ADMIN //</div>
            <label class="admin-label">PRÓXIMO SHOW</label>
            <input type="datetime-local" id="adminDateInput" class="admin-input">
            <div class="admin-current" id="adminCurrent"></div>
            <div class="admin-buttons">
                <button id="adminSave" class="admin-btn save">GUARDAR</button>
                <button id="adminCancel" class="admin-btn cancel">CANCELAR</button>
            </div>
        </div>
    </div>

    <audio id="radio-player" crossorigin="anonymous"></audio>
    <script src="script.js"></script>
</body>
</html>
